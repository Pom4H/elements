name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - run: bun run check
      - run: bun run release:check --skip-build
      - run: bun run registry:proof
      - run: bun run registry:sync
      - run: bun run registry:check
      - run: bun run --filter @pom4h/elements-playground build
      - run: bun run registry:demo-proof
      - name: Commit second-domain proof artifacts
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/electrical-elements-domain'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock registry/*.manifest.json docs/screenshots/registry-*.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Sync electrical registry proof artifacts"
          git push origin HEAD:${{ github.head_ref }}
      - uses: actions/upload-artifact@v4
        with:
          name: two-domain-registry-proof
          path: |
            apps/playground/dist
            registry/*.manifest.json
            docs/screenshots/registry-*.png
          if-no-files-found: error
          retention-days: 7
