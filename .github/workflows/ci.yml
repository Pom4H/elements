name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - run: bun run check
      - run: bun run release:check --skip-build
      - run: bun run registry:proof
      - run: bun run registry:check
      - run: bun run registry:demo-proof
      - name: Commit Registry Explorer proof screenshots
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/registry-contract-explorer'
        run: |
          if git ls-files --error-unmatch docs/screenshots/registry-explorer-desktop.png >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/registry-explorer-*.png
          git commit -m "Add Registry Explorer proof screenshots"
          git push origin HEAD:${{ github.head_ref }}
      - uses: actions/upload-artifact@v4
        with:
          name: playground-and-registry-proof
          path: |
            apps/playground/dist
            docs/screenshots/registry-explorer-*.png
          if-no-files-found: error
          retention-days: 7
