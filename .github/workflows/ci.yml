name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - run: bun run check
      - run: bun run release:check --skip-build
      - run: bun run registry:proof
      - run: bun run registry:check
      - run: bun run registry:demo-proof
      - uses: actions/upload-artifact@v4
        with:
          name: playground-and-registry-proof
          path: |
            apps/playground/dist
            registry/elements.manifest.json
            docs/screenshots/registry-explorer-*.png
          if-no-files-found: error
          retention-days: 7
