name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run release:check --skip-build
      - run: bun run registry:proof
      - run: bun run registry:sync
      - name: Commit generated registry snapshot
        if: github.event_name == 'pull_request'
        run: |
          git add registry/electrical-elements.manifest.json registry/elements.manifest.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Sync electrical elements registry"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
      - run: bun run registry:check
      - run: bun run registry:demo-proof
      - uses: actions/upload-artifact@v4
        with:
          name: two-domain-registry-proof
          path: |
            apps/playground/dist
            registry/*.manifest.json
            docs/screenshots/registry-*.png
          if-no-files-found: error
          retention-days: 7
