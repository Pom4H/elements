name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - run: bun run check
      - run: bun run release:check --skip-build
      - uses: actions/upload-artifact@v4
        with:
          name: playground-dist
          path: apps/playground/dist
          if-no-files-found: error
          retention-days: 7
