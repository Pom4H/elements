name: Render control valve preview

on:
  push:
    branches: [agent/control-valve-animation]

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install cairosvg
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python scripts/render-control-valve-video.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/media/control-valve.mp4 docs/media/control-valve-poster.png
          git commit -m "render control valve animation"
          git push
